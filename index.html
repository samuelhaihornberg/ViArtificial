<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViA - Coach & Planificatrice</title>
</head>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #F3F4F6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    #UI_App { width: 100%; max-width: 450px; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 80vh; }
    #UI_Chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #FAFAFA; }
    #UI_Controls { display: flex; padding: 15px; background: white; border-top: 1px solid #E5E7EB; }
    #UI_Inp { flex: 1; padding: 12px; border: 1px solid #D1D5DB; border-radius: 20px; outline: none; }
    #UI_Btn { background: #4F46E5; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; margin-left: 10px; cursor: pointer; font-weight: bold; }
</style>
<body>

    <div id="UI_App">
        <div id="UI_Chat"></div>
        <div id="UI_Controls">
            <!-- Ajout de l'événement onkeypress pour la touche Entrée -->
            <input type="text" id="UI_Inp" placeholder="Une tâche à planifier ?" onkeypress="checkEnter(event)">
            <!-- Ajout de l'événement onclick pour le bouton Go -->
            <button id="UI_Btn" onclick="triggerAction()">Go</button>
        </div>
    </div>

<!-- Encapsulation de l'architecture Coff hors du script -->
<propriety style="display:none;">
    <coAPI_Url➡️"http://localhost:3000/api/chat">
</propriety>

<value style="display:none;">
    <coUI_Btn✅↔️UI_Inp➡️Txt_U>
    <coTxt_U↔️API_Url➡️callViA()>
    <coTxt_U➡️❌UI_Inp>
</value>

<script>
    // --- Moteur d'exécution JavaScript (Le Traducteur Temporaire) ---
    const API_Url = "http://localhost:3000/api/chat";
    const UI_Chat = document.getElementById("UI_Chat");
    const UI_Inp = document.getElementById("UI_Inp");

    function checkEnter(event) {
        if (event.key === "Enter") triggerAction();
    }

    function triggerAction() {
        const text = UI_Inp.value.trim();
        if (text) {
            callViA(text);
            UI_Inp.value = ""; // Exécution du <coTxt_U➡️❌UI_Inp>
        }
    }

    async function callViA(text) {
        UI_Chat.innerHTML += `<div style="align-self: flex-end; background: #4F46E5; color: white; padding: 10px; border-radius: 10px;">${text}</div>`;
        const loadId = "load-" + Date.now();
        UI_Chat.innerHTML += `<div id="${loadId}" style="align-self: flex-start; color: gray; font-size: 0.9em;">ViA réfléchit...</div>`;
        UI_Chat.scrollTop = UI_Chat.scrollHeight;
        
        try {
            const res = await fetch(API_Url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: text })
            });
            const data = await res.json();
            document.getElementById(loadId).remove();
            
            // Formatage du texte renvoyé par Gemini
            const formatResponse = data.reponse.replace(/\n/g, '<br>');
            UI_Chat.innerHTML += `<div style="align-self: flex-start; background: #E5E7EB; padding: 10px; border-radius: 10px; line-height: 1.4;">${formatResponse}</div>`;
            UI_Chat.scrollTop = UI_Chat.scrollHeight;
        } catch (e) {
            document.getElementById(loadId).remove();
            UI_Chat.innerHTML += `<div style="color: red;">Erreur de synchronisation 🛑</div>`;
        }
    }
</script>
</body>
</html>
