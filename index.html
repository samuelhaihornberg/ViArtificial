/// Txt_U : Texte saisi par l'utilisateur (True si non-vide)
/// Load : Indicateur "ViA réfléchit..."
/// Txt_IA : Réponse générée par Gemini

/// --- 2. CONNEXIONS ET ROUTAGE (Les Émojis - Le "Un pour tout") ---

<co🔄✅➡️Txt_IA>
<coTxt_IA➡️❌Load>
<coTxt_IA➡️UI_Chat>
