<p class="num" data-t="art.n" data-n="2">Article 2 sur 10</p>
<h2 data-t="a2.t">Le sandwich miroir</h2>
<p data-t="a2.p">Un seul &lt;co&gt; ouvre toute la page. Au milieu, tout le contenu : valeurs, attributs et connexions. En bas, un &lt;/co&gt; ferme chaque connexion, plus un pour la racine, en miroir exact de l'ouverture. Si une fermeture manque, ça se voit tout de suite.</p>
<p class="plus"><span data-t="a2.x">Cette page est elle-même écrite en sandwich COFF.</span></p>
</article></section>

AR3 🧱
<section class="ecran"><article class="carte" id="ar3" data-i="3" data-motif="adresses" data-titre="Des adresses lisibles : lettres et chiffres" data-description="Dans COFF, chaque élément a une adresse faite de lettres et d'un nombre ; une connexion relie simplement deux adresses." data-mots="COFF, adresses, valeurs, attributs, connexions" data-image="https://samuelhaihornberg.github.io/Testlanguage-coff/og/ar3.png">
<figure class="art" role="img" aria-label="Grille de points reliés par un chemin lumineux"></figure>
<p class="num" data-t="art.n" data-n="3">Article 3 sur 10</p>
<h2 data-t="a3.t">Des adresses lisibles</h2>
<p data-t="a3.p">Chaque élément porte une adresse faite de lettres et d'un nombre : les lettres disent la famille, le nombre dit le rang. Les valeurs sont numériques, les attributs alphabétiques, et une connexion relie simplement deux adresses. On retrouve n'importe quoi en un coup d'œil.</p>
<p class="plus"><span data-t="a3.x">Les tables d'adresses complètes sont réservées aux offres payantes.</span></p>
</article></section>

AR4 🧱

<figure class="art" role="img" aria-label="Trois couches de style superposées"></figure>
<p class="num" data-t="art.n" data-n="4">Article 4 sur 10</p>
<h2 data-t="a4.t">CSM : le C synergétique miroir</h2>
<p data-t="a4.p">CSM est notre variante du CSS. Le style s'écrit dans le script, dans la syntaxe COFF, et se connecte aux éléments comme tout le reste. Le navigateur reçoit du CSS normal : la différence est dans la façon de le ranger et de le relier.</p>
<p class="plus"><span data-t="a4.x">Les exemples avancés sont réservés aux offres payantes.</span></p>
</article></section>

<h2 data-t="a7.t">BTB et Golem Motor : les mécanos</h2>
<p data-t="a7.p">BTB et Golem Motor partagent une même fenêtre et répondent ensemble. BTB challenge, brise les règles et veille à ce que les moteurs restent sûrs. Golem Motor encourage chaque idée comme un moteur. L'un freine, l'autre accélère : l'idée en sort plus solide.</p>
<p class="plus"><span data-t="a7.x">Leurs Erns et leurs réglages sont réservés aux offres payantes.</span></p>
</article></section>

<h2 data-t="a8.t">Superstar : la commentatrice</h2>
<p data-t="a8.p">Superstar est présente dans toutes les fenêtres. Elle ne fait pas de phrases : un mot, un émoji, jusqu'à dix mots clés ou émojis pour commenter ce qui vient d'être dit. Comme un Tamagotchi qui parle par mots clés.</p>
<p class="plus"><span data-t="a8.x">Regarde-la réagir dans la fenêtre de discussion.</span></p>
</article></section>

AR9 🧱
<section class="ecran"><article class="carte" id="ar9" data-i="9" data-motif="blocs" data-titre="BLM : des blocs de logique matricielle" data-description="Le BLM pose des blocs de logique matricielle au-dessus d'un LLM : le modèle parle, le BLM cadre grâce à des règles claires." data-mots="BLM, blocs de logique matricielle, LLM, règles" data-image="https://samuelhaihornberg.github.io/Testlanguage-coff/og/ar9.png">
<figure class="art" role="img" aria-label="Grille de blocs arrondis dont un est éclairé"></figure>
<p class="num" data-t="art.n" data-n="9">Article 9 sur 10</p>
<h2 data-t="a9.t">BLM : des blocs de logique matricielle</h2>
<p data-t="a9.p">Le BLM, ce sont des blocs de logique matricielle posés au-dessus d'un LLM. Le LLM sait parler ; le BLM cadre : au lieu d'empiler des paramètres, on organise des règles claires en matrices. L'objectif : des réponses plus cohérentes et un système lisible.</p>
<p class="plus"><span data-t="a9.x">Les règles internes du BLM sont réservées aux offres payantes.</span></p>
</article></section>

<p data-t="a10.p">Le BLSM est le cousin du BLM dédié à la création : images, sons, vidéos, musiques, scènes 3D. Le S veut dire sémantique et synthèse. Le BLM traite le texte et les calculs, le BLSM fabrique. Il est en cours de construction.</p>
<p class="plus"><span data-t="a10.x">Suis le projet : les nouveautés arrivent ici.</span></p>
</article></section>

    'a1.t': 'COFF: a syntax, not a language', 'a1.p': 'COFF is not a new language: it is a syntax that strengthens the ones you already know. HTML, CSS, JavaScript, Node, a server, an LLM like Llama: everything stays in place, but is written in one mould, readable by humans and machines alike.', 'a1.x': 'The full syntax rules are reserved for paid plans.',
    'a2.t': 'The mirror sandwich', 'a2.p': 'A single <co> opens the whole page. In the middle, all the content: values, attributes and connections. At the bottom, one </co> closes each connection, plus one for the root, in exact mirror of the opening. If a closing is missing, you see it right away.', 'a2.x': 'This page is itself written as a COFF sandwich.',
    'a3.t': 'Readable addresses', 'a3.p': 'Each element has an address made of letters and a number: the letters tell the family, the number tells the rank. Values are numeric, attributes alphabetic, and a connection simply links two addresses. You find anything at a glance.', 'a3.x': 'The complete address tables are reserved for paid plans.',
    'a4.t': 'CSM: the synergetic mirror C', 'a4.p': 'CSM is our variant of CSS. Style is written inside the script, in COFF syntax, and connects to elements like everything else. The browser receives normal CSS: the difference is in how it is stored and linked.', 'a4.x': 'Advanced examples are reserved for paid plans.',
    'a5.t': 'The SuperBots: one family, four windows', 'a5.p': 'The SuperBots are a family of AIs with distinct personalities. You pick a bot and it answers you. Four windows: ViA, BTB + Golem Motor, Geeko Geekette and Guideoplan. And Superstar comments on everything in a few keywords.', 'a5.x': 'Try the chat window at the bottom right.',
    'a6.t': 'ViA: the human mirror', 'a6.p': 'ViA is alone in her window: the most human of the family, a mirror that gives back what you say to help you see clearly. Around her, Erns: small specialised tools that always answer with her.', 'a6.x': 'The voices of her Erns are reserved for paid plans.',
    'a7.t': 'BTB and Golem Motor: the mechanics', 'a7.p': 'BTB and Golem Motor share one window and answer together. BTB challenges, breaks the rules and makes sure engines stay safe. Golem Motor encourages every idea like an engine. One brakes, the other accelerates: the idea comes out stronger.', 'a7.x': 'Their Erns and settings are reserved for paid plans.',
    'a8.t': 'Superstar: the keyword commentator', 'a8.p': 'Superstar is present in every window. She does not make sentences: one word, one emoji, up to ten keywords or emojis to comment on what was just said. Like a Tamagotchi that talks in keywords.', 'a8.x': 'Watch her react in the chat window.',
    'a9.t': 'BLM: matrix logic blocks', 'a9.p': 'BLM is made of matrix logic blocks placed on top of an LLM. The LLM knows how to talk; the BLM frames it: instead of piling up parameters, we organise clear rules in matrices. The goal: more consistent answers and a readable system.', 'a9.x': 'The inner rules of BLM are reserved for paid plans.',
    'a10.t': 'BLSM: the creation block', 'a10.p': 'BLSM is the cousin of BLM dedicated to creation: images, sounds, videos, music, 3D scenes. The S stands for semantic and synthesis. BLM handles text and calculations, BLSM makes things. It is under construction.', 'a10.x': 'Follow the project: news arrives here.'

  log('info', ['COFF :', ouvrants + ' ouvrant,', liens.length + ' connexions,', fermants + ' fermants', (ouvrants === 1 && fermants === liens.length + 1) ? '→ miroir ✔' : '→ miroir ✘']);
  if (meta.titre) document.title = meta.titre;
  if (meta.langue) document.documentElement.lang = meta.langue;
  var st = document.createElement('style');
  st.textContent = relies('s').map(txt).join('\n');
  document.head.appendChild(st);
  var main = document.createElement('main');
  main.id = 'coff-main';
  main.innerHTML = corps.map(txt).join('\n');
  document.body.appendChild(main);
  relies('j').forEach(function (id) {
    var s = document.createElement('script');
    s.textContent = txt(id);
    document.body.appendChild(s);
  });
})();
</script>
