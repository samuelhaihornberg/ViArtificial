<!DOCTYPE html>
<!-- ↕️ -->
<html lang="fr">
<!-- ↕️ -->
<head>
<!-- ↕️ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViA - Auth Mobile Edge</title>
<style>
    :root {
        --primary: #6366f1;
        --secondary: #ec4899;
        --bg-pulse: #0f172a;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-pulse);
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        position: relative;
    }

    /* Écrans d'Authentification (Inscription / Connexion) */
    .auth-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 23, 42, 0.98);
        backdrop-filter: blur(15px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
        padding: 20px;
    }
    .auth-card {
        background: rgba(30, 41, 59, 0.95);
        padding: 25px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .auth-card h2 { text-align: center; color: #fff; font-size: 1.3rem; margin: 0; }
    .auth-input {
        padding: 12px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        color: #fff;
        outline: none;
        font-size: 0.95rem;
    }
    .auth-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
    }
    .auth-switch {
        text-align: center;
        font-size: 0.85rem;
        color: #94a3b8;
        cursor: pointer;
        margin-top: 5px;
    }
    .auth-switch span { color: var(--secondary); text-decoration: underline; }

    .bg-shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(50px);
        opacity: 0.3;
        animation: pulseAnimation 3s infinite alternate ease-in-out;
        z-index: -1;
    }
    .shape-1 { width: 250px; height: 250px; background: var(--primary); top: 10%; left: 10%; }
    .shape-2 { width: 300px; height: 300px; background: var(--secondary); bottom: 10%; right: 10%; }

    @keyframes pulseAnimation {
        0% { transform: scale(1); opacity: 0.2; }
        100% { transform: scale(1.2); opacity: 0.5; }
    }

    .blop-emoji {
        position: absolute;
        font-size: 1.5rem;
        animation: floatBlop 4s ease-out forwards;
        pointer-events: none;
        z-index: 10;
    }
    @keyframes floatBlop {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        50% { opacity: 1; transform: translateY(-30px) scale(1.2); }
        100% { transform: translateY(-60px) scale(1); opacity: 0; }
    }

    #UI_App {
        width: 100%;
        max-width: 500px;
        background: rgba(30, 41, 59, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        height: 90vh;
        z-index: 2;
    }

    #UI_Header {
        padding: 15px;
        background: rgba(15, 23, 42, 0.7);
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .via-logo {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 1px;
        color: #fff;
        display: inline-flex;
        align-items: center;
    }
    .robot-i {
        position: relative;
        display: inline-block;
        margin: 0 2px;
        color: var(--secondary);
    }
    .robot-head {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 8px;
        background: #38bdf8;
        border-radius: 3px;
        box-shadow: 0 0 6px #38bdf8;
    }

    #UI_Chat {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .msg-bubble {
        padding: 12px 15px;
        border-radius: 12px;
        line-height: 1.4;
        font-size: 0.9rem;
        max-width: 88%;
        word-break: break-word;
    }
    .user-msg { background: var(--primary); color: white; align-self: flex-end; }
    .via-msg { background: rgba(51, 65, 85, 0.9); color: #e2e8f0; align-self: flex-start; border-left: 3px solid var(--secondary); }
    
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.8rem; }
    th, td { border: 1px solid rgba(255,255,255,0.1); padding: 6px; text-align: left; }
    th { background: rgba(15, 23, 42, 0.8); color: #38bdf8; }

    #UI_Controls { display: flex; padding: 12px; background: rgba(15, 23, 42, 0.7); gap: 6px; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    #UI_Inp { flex: 1; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; color: #fff; outline: none; font-size: 0.9rem; }
    
    .action-btn {
        background: rgba(255,255,255,0.1);
        color: white;
        border: none;
        border-radius: 50%;
        width: 38px; height: 38px;
        cursor: pointer;
        display: flex; justify-content: center; align-items: center;
        font-size: 0.9rem;
    }
    .mic-active { background: #ef4444 !important; }
</style>
<!-- ↕️ -->
</head>
<!-- ↕️ -->
<body>
<!-- ↕️ -->

    <!-- Écran de Connexion -->
    <div id="UI_LoginOverlay" class="auth-overlay">
        <div class="auth-card">
            <h2>Connexion ViA</h2>
            <input type="text" id="loginUser" class="auth-input" placeholder="Nom d'utilisateur">
            <input type="password" id="loginPin" class="auth-input" placeholder="Code PIN (5-13 chiffres)" maxlength="13">
            <button class="auth-btn" onclick="handleLogin()">Se connecter ⚡</button>
            <div id="loginError" style="color: #f87171; font-size: 0.8rem; text-align: center;"></div>
            <div class="auth-switch" onclick="switchToRegister()">Pas de compte ? <span>S'inscrire</span></div>
        </div>
    </div>

    <!-- Écran d'Inscription (Caché par défaut) -->
    <div id="UI_RegisterOverlay" class="auth-overlay" style="display: none;">
        <div class="auth-card">
            <h2>Inscription ViA</h2>
            <input type="text" id="regUser" class="auth-input" placeholder="Choisir un nom d'utilisateur">
            <input type="password" id="regPin" class="auth-input" placeholder="Créer un Code PIN (5-13 chiffres)" maxlength="13">
            <button class="auth-btn" onclick="handleRegister()">Créer le compte 🚀</button>
            <div id="regError" style="color: #f87171; font-size: 0.8rem; text-align: center;"></div>
            <div class="auth-switch" onclick="switchToLogin()">Déjà un compte ? <span>Se connecter</span></div>
        </div>
    </div>

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div id="UI_App" style="display: none;">
        <div id="UI_Header">
            <div class="via-logo">V<span class="robot-i">i<span class="robot-head"></span></span>A</div>
            <div style="display: flex; gap: 6px;">
                <button class="action-btn" onclick="toggleVoiceSpeech()" id="ttsToggleBtn" title="Voix">🔊</button>
                <button class="action-btn" onclick="handleLogout()" title="Déconnexion">🚪</button>
            </div>
        </div>
        <div id="UI_Chat">
            <div class="msg-bubble via-msg">
                Session sécurisée active. Pose ta question ou soumets ton projet : je génère l'analyse sémantique complète (500-1266 mots). 🚀
            </div>
        </div>
        <div id="UI_Controls">
            <button class="action-btn" id="micBtn" onclick="toggleDictation()" title="Dictée vocale">🎤</button>
            <input type="text" id="UI_Inp" placeholder="Message ou dictée..." onkeypress="checkEnter(event)">
            <button class="action-btn" style="background: var(--primary);" onclick="triggerAction()" title="Envoyer">⚡</button>
        </div>
    </div>

<script>
<!-- ↕️ -->
    let isTTSEnabled = true;
    let recognition = null;

    // Basculer vers l'écran d'inscription
    function switchToRegister() {
        document.getElementById('UI_LoginOverlay').style.display = 'none';
        document.getElementById('UI_RegisterOverlay').style.display = 'flex';
    }

    // Basculer vers l'écran de connexion
    function switchToLogin() {
        document.getElementById('UI_RegisterOverlay').style.display = 'none';
        document.getElementById('UI_LoginOverlay').style.display = 'flex';
    }

    // Enregistrement d'un nouvel utilisateur en local
    function handleRegister() {
        const user = document.getElementById('regUser').value.trim();
        const pin = document.getElementById('regPin').value.trim();
        const errorDiv = document.getElementById('regError');

        if (!user) {
            errorDiv.textContent = "Le nom d'utilisateur est requis.";
            return;
        }
        if (pin.length < 5 || pin.length > 13 || isNaN(pin)) {
            errorDiv.textContent = "Le PIN doit contenir entre 5 et 13 chiffres.";
            return;
        }

        // Sauvegarde dans localStorage
        localStorage.setItem("ViA_User_" + user, pin);
        alert("Compte créé avec succès ! Connecte-toi.");
        switchToLogin();
    }

    // Connexion de l'utilisateur
    function handleLogin() {
        const user = document.getElementById('loginUser').value.trim();
        const pin = document.getElementById('loginPin').value.trim();
        const errorDiv = document.getElementById('loginError');

        const savedPin = localStorage.getItem("ViA_User_" + user);

        if (!savedPin || savedPin !== pin) {
            errorDiv.textContent = "Identifiant ou Code PIN incorrect.";
            return;
        }

        // Connexion réussie
        document.getElementById('UI_LoginOverlay').style.display = 'none';
        document.getElementById('UI_App').style.display = 'flex';
    }

    // Déconnexion
    function handleLogout() {
        document.getElementById('UI_App').style.display = 'none';
        document.getElementById('UI_LoginOverlay').style.display = 'flex';
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPin').value = '';
    }

    function toggleDictation() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("Dictée vocale non supportée par ce navigateur mobile.");
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'fr-FR';
        
        const micBtn = document.getElementById('micBtn');
        micBtn.classList.add('mic-active');

        recognition.onresult = function(event) {
            UI_Inp.value = event.results[0][0].transcript;
            micBtn.classList.remove('mic-active');
        };
        recognition.onerror = () => micBtn.classList.remove('mic-active');
        recognition.onend = () => micBtn.classList.remove('mic-active');
        recognition.start();
    }

    function toggleVoiceSpeech() {
        isTTSEnabled = !isTTSEnabled;
        document.getElementById('ttsToggleBtn').textContent = isTTSEnabled ? '🔊' : '🔇';
        if (!isTTSEnabled) window.speechSynthesis.cancel();
    }

    function speakText(text) {
        if (!isTTSEnabled || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/<[^>]*>?/gm, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'fr-FR';
        window.speechSynthesis.speak(utterance);
    }

    function createBlop() {
        const emojis = ['✨', '🧬', '⚡', '💡', '🔮'];
        const blop = document.createElement('div');
        blop.className = 'blop-emoji';
        blop.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        blop.style.left = (Math.random() * window.innerWidth * 0.7 + 30) + 'px';
        blop.style.top = (window.innerHeight - 120) + 'px';
        document.body.appendChild(blop);
        setTimeout(() => blop.remove(), 4000);
    }
    setInterval(() => createBlop(), 3500);

    function checkEnter(event) { if (event.key === "Enter") triggerAction(); }
    
    function triggerAction() {
        const text = UI_Inp.value.trim();
        if (text) {
            createBlop();
            callGeminiDirect(text);
            UI_Inp.value = "";
        }
    }

    async function callGeminiDirect(text) {
        UI_Chat.innerHTML += `<div class="msg-bubble user-msg">${text}</div>`;
        const loadId = "load-" + Date.now();
        UI_Chat.innerHTML += `<div id="${loadId}" class="msg-bubble via-msg" style="color: #94a3b8;">ViA déploie l'analyse sémantique (500-1266 mots)...</div>`;
        UI_Chat.scrollTop = UI_Chat.scrollHeight;

        const apiKey = "AQ.Ab8RN6JYp2mwLkm_hdzFkEP0Y0gZ4YVsSxrBfefZSpHkbdf6HQ";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        const systemPrompt = `Tu es ViA, coach et planificateur intelligent. Rédige une réponse très riche et détaillée comprise entre 500 et 1266 mots. 
        Inclus obligatoirement :
        1. Une recherche approfondie des racines originelles des mots et de leur philosophie cachée (synonymes, homonymes, anti-antonymes).
        2. Une astuce et un 'Conseil Coaching Friendly'.
        3. Un tableau comparatif de sécurité structuré (Pour/Qualités, Contre/Défauts, Anti-contre/Anti-défaut, Défense/Sécurité).`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: systemPrompt }] },
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            document.getElementById(loadId).remove();

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const reply = data.candidates[0].content.parts[0].text;
                UI_Chat.innerHTML += `<div class="msg-bubble via-msg">${reply.replace(/\n/g, '<br>')}</div>`;
                UI_Chat.scrollTop = UI_Chat.scrollHeight;
                speakText(reply);
            } else {
                UI_Chat.innerHTML += `<div class="msg-bubble via-msg" style="color: #f87171;">Erreur de génération.</div>`;
            }
        } catch (error) {
            document.getElementById(loadId).remove();
            UI_Chat.innerHTML += `<div class="msg-bubble via-msg" style="color: #f87171;">Erreur réseau mobile 🛑</div>`;
        }
    }
<!-- ↕️ -->
</script>
