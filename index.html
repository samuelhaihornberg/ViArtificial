<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d16">
<meta name="color-scheme" content="dark light">
<title>BLM · SuperBots</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d16'/%3E%3Cpath d='M16 4 28 24H4z M16 28 4 8h24z' fill='none' stroke='%238aa4ff' stroke-width='2'/%3E%3C/svg%3E">
<!-- COFF V5 · adresse = lettres (matrice) + nombre (rang) · matrice APP · un seul fichier : tout est embarqué.
     Le backend (backend.js) sert cette page et porte la base BLM. Version V1.0A.18 -->
<style>
/* COFF V5 · feuille de style unique. Une peau (theme) par page SPA : chaque bot a son propre aspect. */
:root{
  --bg:#0b0d16;--bg2:#141829;--fg:#e9ecf6;--muted:#97a0bd;--accent:#7aa2ff;--accent2:#c58bff;
  --user:#26304f;--bot:#171c30;--line:#2a3150;--radius:16px;--gap:12px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  --head:var(--font);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono",monospace;
  --tabh:46px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;overflow:hidden;transition:background .35s}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:.45rem .8rem;min-height:40px}
button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* barre du haut et onglets */
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
#top h1{font-size:1rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
#top .ver{font:.72rem var(--mono);color:var(--muted)}
#dot{width:10px;height:10px;border-radius:50%;background:#888;box-shadow:0 0 0 2px #0003}
#dot.ok{background:#3ddc84}#dot.llm{background:#3ddc84;box-shadow:0 0 8px #3ddc84}#dot.bad{background:#ff5d5d}
#prov{font-size:.75rem;color:var(--muted);margin-left:auto;text-align:right}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--line);scrollbar-width:thin;flex:none}
#tabs a{flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;height:var(--tabh);min-height:44px;border-radius:12px;text-decoration:none;color:var(--muted);border:1px solid transparent;white-space:nowrap;font-size:.92rem}
#tabs a[aria-current=page]{color:var(--fg);border-color:var(--tc,var(--accent));background:color-mix(in srgb,var(--tc,var(--accent)) 18%,transparent)}
#banner{display:none;background:#5a1d1d;color:#ffd7d7;padding:8px 12px;font-size:.88rem}
#banner.on{display:block}
#pages{flex:1;min-height:0;position:relative}
.page{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--font)}
.page.on{display:flex}
/* en-tête de page */
.hero{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.hero .ico{font-size:1.9rem;line-height:1}
.hero h2{font:700 1.15rem var(--head)}
.hero p{font-size:.8rem;color:var(--muted)}
.hero .grow{flex:1;min-width:0}
details.panel{border-bottom:1px solid var(--line);flex:none}
details.panel>summary{padding:8px 14px;cursor:pointer;font-size:.85rem;color:var(--muted);list-style:none;min-height:40px;display:flex;align-items:center}
details.panel>summary::before{content:"▸ ";margin-right:.3em}
details.panel[open]>summary::before{content:"▾ "}
.panel .inner{padding:4px 14px 12px}
/* contrôles de groupe */
.seats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:.82rem;min-height:36px;user-select:none}
.chip[aria-pressed=true]{border-color:var(--hc);background:color-mix(in srgb,var(--hc) 25%,transparent);color:var(--fg)}
.chip[disabled]{opacity:.35}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent)}
.hint{font-size:.76rem;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
/* messages */
.log{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:92%;position:relative}
.msg.user{align-self:flex-end}
.msg .who{font-size:.74rem;color:var(--muted);margin:0 6px 2px;display:flex;gap:6px;align-items:center}
.msg .who .pv{font:.65rem var(--mono);opacity:.7}
.bubble{position:relative;padding:10px 13px;border-radius:var(--radius);background:var(--bot);border:1px solid color-mix(in srgb,var(--hc,var(--accent)) 55%,var(--line));white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--user);border-color:var(--line)}
.bubble .aff{position:absolute;inset:0;pointer-events:auto;border-radius:inherit;cursor:pointer}
.bubble .layer{position:absolute;inset:0;border-radius:inherit}
.bubble a.addr{color:var(--accent);text-decoration:underline dotted;cursor:pointer}
.sys{align-self:center;font-size:.78rem;color:var(--muted);text-align:center;padding:2px 8px}
.ideas{align-self:stretch;border:1px dashed var(--line);border-radius:var(--radius);padding:8px 12px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.ideas b{font-size:.8rem;color:var(--accent)}.ideas ol{margin:.3rem 0 0 1.2rem;font-size:.92rem}
.typing{align-self:flex-start;font-size:.8rem;color:var(--muted);padding:2px 10px}
.typing::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
/* composeur */
.composer{flex:none;display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg2)}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:30vh;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.composer .send{min-width:64px;background:var(--accent);color:#0a0a12;border-color:var(--accent);font-weight:700}
.tools{display:flex;gap:6px;padding:4px 10px 0;flex-wrap:wrap;font-size:.8rem;background:var(--bg2)}
.tools button{min-height:32px;padding:.2rem .6rem;font-size:.8rem}
/* pages techniques */
.scroll{flex:1;min-height:0;overflow:auto;padding:12px 14px 24px}
.scroll h3{margin:14px 0 6px;font-size:1rem}
.card{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg2);margin:8px 0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.84rem;margin:8px 0}
label.f input,label.f select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:40px}
label.inl{display:flex;gap:8px;align-items:center;margin:8px 0;min-height:36px}
input[type=range]{width:100%}
pre.coff{white-space:pre-wrap;font:.78rem/1.4 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;overflow:auto;max-height:50vh}
.res{display:flex;flex-direction:column;gap:4px}.res button{text-align:left}
canvas#hs,canvas#mk{width:100%;border-radius:14px;border:1px solid var(--line);background:#000;display:block;touch-action:none}
canvas#mk{height:190px}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:5px}.led.ok{background:#3ddc84}.led.ko{background:#ff5d5d}
.gauge{height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#fff,#ffd34d,#ff7a3b)}
.stages{display:flex;gap:6px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}.stages span.on{color:var(--fg);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ========================= LES PEAUX : un aspect différent par page ========================= */
/* Famille : cosmos, bulles rondes lumineuses */
[data-theme=famille]{--bg:#080a14;--bg2:#10142a;--accent:#8aa4ff;--accent2:#d28bff;--bot:#141a35;--user:#2a2f5e;--radius:20px;
  background:radial-gradient(1200px 500px at 50% -10%,#1d2252 0%,transparent 60%),#080a14}
[data-theme=famille] .bubble{box-shadow:0 0 18px color-mix(in srgb,var(--hc,#8aa4ff) 22%,transparent)}
/* Superbot : anneaux de conscience */
[data-theme=superbot]{--bg:#06122b;--bg2:#0b1d42;--accent:#5aa9ff;--bot:#0d2250;--user:#163a73;--line:#1d3f7a;--radius:26px;
  background:repeating-radial-gradient(circle at 50% 38%,#0a1e47 0 38px,#06122b 38px 76px)}
[data-theme=superbot] .hero h2{letter-spacing:.14em;text-transform:uppercase;font-weight:300}
[data-theme=superbot] .bubble{border-width:1px;box-shadow:0 0 0 4px #5aa9ff14}
/* Justicia : tablette de loi, or sur parchemin sombre, bords doubles */
[data-theme=justicia]{--bg:#1a1508;--bg2:#251d0b;--fg:#f4ecd5;--muted:#c2b387;--accent:#e2b93b;--bot:#2b2210;--user:#3a2f14;--line:#6d5a1f;--radius:3px;--font:Georgia,"Times New Roman","Noto Serif",serif;--head:Georgia,"Times New Roman",serif;
  background:linear-gradient(180deg,#1a1508,#120e05)}
[data-theme=justicia] .bubble{border:3px double #b8932a;background:#2b2210}
[data-theme=justicia] .hero h2{font-variant:small-caps;letter-spacing:.08em}
[data-theme=justicia] .hero{border-bottom:3px double #6d5a1f}
[data-theme=justicia] .msg .who::before{content:"§";color:#e2b93b}
/* Golem Motor : forge, découpes anguleuses, braises */
[data-theme=golem]{--bg:#120e0c;--bg2:#1d1511;--accent:#ff7a2e;--accent2:#ffb02e;--bot:#241812;--user:#3b2314;--line:#4a2f1d;--radius:0;--head:Impact,"Arial Narrow Bold","Haettenschweiler",system-ui,sans-serif;
  background:linear-gradient(0deg,#3a1604 0,#120e0c 38%)}
[data-theme=golem] .hero h2{font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;font-weight:400;color:#ffb02e;text-shadow:0 0 12px #ff7a2e80}
[data-theme=golem] .bubble{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));border:0;background:linear-gradient(135deg,#3a2112,#241812);box-shadow:inset 3px 0 0 #ff7a2e}
[data-theme=golem] .msg.user .bubble{background:linear-gradient(135deg,#4d2a14,#3b2314)}
[data-theme=golem] button{border-radius:0;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
/* B.T.B : terminal, ligne de balayage, boîtes en pointillé */
[data-theme=btb]{--bg:#030a05;--bg2:#06130a;--fg:#c8ffd4;--muted:#5fae75;--accent:#39ff7a;--bot:#04100a;--user:#0a2413;--line:#14532d;--radius:2px;--font:var(--mono);--head:var(--mono);
  background:repeating-linear-gradient(0deg,#030a05 0 2px,#04100a 2px 4px)}
[data-theme=btb] .bubble{border:1px dashed #39ff7a;font-size:.92rem}
[data-theme=btb] .msg:not(.user) .bubble::before{content:"> ";color:#39ff7a}
[data-theme=btb] .hero h2::after{content:"_";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* ViA : pastel chaud, bulles pilule qui rebondissent doucement */
[data-theme=via]{--bg:#2a1220;--bg2:#3a1a2e;--fg:#fff1f6;--muted:#f1b8cd;--accent:#ff7eb6;--accent2:#ffc27e;--bot:#4a2039;--user:#6a2a4c;--line:#7a3a5c;--radius:28px;--font:"Trebuchet MS","Segoe UI",system-ui,"Noto Sans",sans-serif;
  background:radial-gradient(circle at 20% 10%,#5a2346 0,transparent 45%),radial-gradient(circle at 85% 80%,#5a3a23 0,transparent 40%),#2a1220}
[data-theme=via] .bubble{border:2px solid #ff7eb6;animation:bob 4.5s ease-in-out infinite}
[data-theme=via] .msg.user .bubble{border-color:#ffc27e}
@keyframes bob{50%{transform:translateY(-2px) rotate(-.2deg)}}
[data-theme=via] .hero h2{font-weight:800}
/* Matrixia : grille cyan, cellules de tableau avec adresse */
[data-theme=matrixia]{--bg:#041217;--bg2:#07202a;--fg:#d8f7ff;--muted:#7bb8c8;--accent:#27e0ff;--bot:#06222d;--user:#0a3140;--line:#0f5062;--radius:0;--font:var(--mono);--head:var(--mono);
  background-color:#041217;background-image:linear-gradient(#0c3947 1px,transparent 1px),linear-gradient(90deg,#0c3947 1px,transparent 1px);background-size:24px 24px}
[data-theme=matrixia] .bubble{border:1px solid #27e0ff;background:#06222dee;font-size:.9rem}
[data-theme=matrixia] .msg:not(.user)::before{content:attr(data-addr);position:absolute;right:6px;top:-9px;font:.62rem var(--mono);background:#041217;color:#27e0ff;padding:0 4px;border:1px solid #0f5062;z-index:2}
/* Mirroria : argent clair, reflet sous chaque bulle */
[data-theme=mirroria]{--bg:#dfe3ee;--bg2:#f3f5fa;--fg:#1c1f2e;--muted:#5d6580;--accent:#7a5cff;--bot:#fff;--user:#e8e1ff;--line:#b9c0d6;--radius:14px;
  background:linear-gradient(115deg,#f5f7fc 0,#cfd5e6 30%,#f5f7fc 48%,#c3cade 70%,#eef0f8 100%)}
[data-theme=mirroria] .bubble{background:linear-gradient(180deg,#fff,#eef0f8);box-shadow:0 14px 10px -12px #5d658090,0 2px 0 #fff inset}
[data-theme=mirroria] .msg:not(.user)::after{content:"";display:block;height:14px;margin:2px 6px 0;border-radius:50%;background:radial-gradient(ellipse at 50% 0,#7a5cff30,transparent 70%);transform:scaleY(-1);opacity:.7}
[data-theme=mirroria] #tabs,[data-theme=mirroria] .hero{color:#1c1f2e}
/* Théo : parchemin bleu et blanc, serif, bulles en rouleau */
[data-theme=theo]{--bg:#f1ead6;--bg2:#e6dcc0;--fg:#1b2a52;--muted:#5d6a8f;--accent:#1f4aa8;--bot:#fbf6e6;--user:#dbe5fa;--line:#b7a878;--radius:4px;--font:Georgia,"Times New Roman","Noto Serif Hebrew","Noto Serif",serif;--head:Georgia,serif;
  background:linear-gradient(90deg,#e6dcc0 0,#f1ead6 6%,#f1ead6 94%,#e6dcc0 100%)}
[data-theme=theo] .bubble{border:0;border-top:3px solid #1f4aa8;border-bottom:3px solid #1f4aa8;background:#fbf6e6;font-size:1.02rem}
[data-theme=theo] .hero h2::after{content:" א";color:#1f4aa8;opacity:.55}
[data-theme=theo] .hero h2{font-style:italic}
/* Synerbot : violet, fils de liaison entre les bulles */
[data-theme=synerbot]{--bg:#150a26;--bg2:#1f1038;--accent:#c58bff;--accent2:#6fe3ff;--bot:#26124a;--user:#3a1d6e;--line:#4a2a85;--radius:18px;
  background:linear-gradient(160deg,#150a26,#230f3f 55%,#0f1c3a)}
[data-theme=synerbot] .log{position:relative}
[data-theme=synerbot] .msg:not(:last-child)::after{content:"";position:absolute;left:22px;bottom:-12px;width:2px;height:12px;background:linear-gradient(#c58bff,#6fe3ff)}
[data-theme=synerbot] .bubble{border-image:linear-gradient(135deg,#c58bff,#6fe3ff) 1;border-radius:0}
/* Atelier, Base, Réglages */
[data-theme=atelier]{--bg:#0a0a0a;--bg2:#161616;--accent:#ffd34d;--line:#333}
[data-theme=base]{--bg:#0c1118;--bg2:#131b26;--accent:#6fe3ff}
[data-theme=reglages]{--bg:#101014;--bg2:#1a1a22;--accent:#9aa7ff}

/* compact et lisible sur téléphone */
.modes button{min-height:34px;padding:.2rem .6rem;font-size:.84rem}
.chip{min-height:32px;padding:2px 9px;font-size:.8rem}
input[type=text],input[type=password],input[type=search],select{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:10px}

</style>
</head>
<body data-theme="famille">
<header id="top">
  <span id="dot" title="état du backend" role="img" aria-label="état du backend"></span>
  <h1>BLM · SuperBots</h1><span class="ver">V1.0A.18</span>
  <span id="prov" aria-live="polite">…</span>
</header>
<nav id="tabs" aria-label="Pages"></nav>
<div id="banner" role="status"></div>
<main id="pages"></main>
<noscript>Cette page a besoin de JavaScript.</noscript>
<script>
/* COFF V5 · moteur de rendu, d'image et de son (un seul fichier, aucune dépendance)
   AFF  : l'affichage par ballons de peinture (une cellule = un ballon qui éclate)
   HS   : le filtre High Stream (WebGL2, repli Canvas 2D) : ombre/lumière → netteté → couleur → reflet
   MRK  : la merkaba de la famille (double tétraèdre), placement provisoire des bots
   AUD  : son (WebAudio, placement binaural HRTF) et voix du navigateur
   Honnêteté : ce sont des filtres et des animations de page web, pas le shader complet de 3 158 réglages. */
'use strict';
const ENG = (() => {
  const reduced = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
  const hsl = (h, s, l, a) => 'hsla(' + h + ',' + s + '%,' + l + '%,' + (a == null ? 1 : a) + ')';

  /* ====================== AFF : ballons de peinture ====================== */
  const AFF = (() => {
    const running = new Set();
    function noise(w, h) {            // relief : un champ de hauteur lisse, 4 octaves de bruit de valeur
      const g = [], N = 24; for (let i = 0; i < (N + 1) * (N + 1); i++) g.push(Math.random());
      const at = (x, y) => { x = Math.max(0, Math.min(1, x)); y = Math.max(0, Math.min(1, y)); const fx = x * N, fy = y * N, ix = Math.min(N - 1, fx | 0), iy = Math.min(N - 1, fy | 0), tx = fx - ix, ty = fy - iy;
        const a = g[iy * (N + 1) + ix], b = g[iy * (N + 1) + ix + 1], c = g[(iy + 1) * (N + 1) + ix], d = g[(iy + 1) * (N + 1) + ix + 1];
        const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty); return (a + (b - a) * sx) * (1 - sy) + (c + (d - c) * sx) * sy; };
      return at;
    }
    /* reveal(bubble, hue, opts) : pose une couche de ballons sur la bulle ; ils éclatent dans l'ordre de lecture.
       Sécurité AFF : le texte reste dans la page (lisible, sélectionnable) ; la durée totale est bornée ; clic = tout afficher. */
    function reveal(bubble, hue, o) {
      o = Object.assign({ cw: 12, ch: 24, wave: 40, maxMs: 1100, budgetMs: 4, onDone: null }, o || {});
      if (reduced() || o.off) { o.onDone && o.onDone(); return null; }
      const W = bubble.clientWidth, H = bubble.clientHeight;
      if (W < 10 || H < 10) { o.onDone && o.onDone(); return null; }
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      let cw = o.cw, ch = o.ch;
      while ((W / cw) * (H / ch) > 6000) { cw *= 1.25; ch *= 1.25; }       // jamais plus de 6 000 ballons
      const cols = Math.ceil(W / cw), rows = Math.ceil(H / ch), total = cols * rows;
      const layer = document.createElement('canvas'), fx = document.createElement('canvas');
      [layer, fx].forEach(c => { c.width = W * dpr; c.height = H * dpr; c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;'; });
      fx.style.pointerEvents = 'none'; layer.className = 'aff'; layer.title = 'Cliquer : tout afficher';
      bubble.appendChild(layer); bubble.appendChild(fx);
      const L = layer.getContext('2d'), F = fx.getContext('2d'); L.scale(dpr, dpr); F.scale(dpr, dpr);
      const n = noise(W, H);
      // chaque ballon : teinte selon le relief (creux = plus de peinture), décoloration selon la profondeur avant/arrière
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const x = c * cw, y = r * ch, u = (c + .5) / cols, v = (r + .5) / rows;
        const h0 = n(u, v), gx = n(u + 1 / cols, v) - n(u - 1 / cols, v), gy = n(u, v + 1 / rows) - n(u, v - 1 / rows);
        const depth = 1 - h0, lit = Math.max(0, Math.min(1, 0.5 + (gx + gy) * 2.2));
        const sat = 55 + depth * 35, lum = 24 + lit * 26 - depth * 6, hh = hue + (h0 - .5) * 40;
        const grd = L.createRadialGradient(x + cw * .35, y + ch * .3, 1, x + cw / 2, y + ch / 2, Math.max(cw, ch) * .75);

    const f = (k, label, type, opts) => { let i; if (type === 'select') { i = el('select', null, ...opts.map(([v, t]) => el('option', { value: v, text: t }))); i.value = CFG[k]; i.addEventListener('change', () => { CFG[k] = i.value; saveCfg(); refreshProv(); }); } else if (type === 'check') { i = el('input', { type: 'checkbox' }); i.checked = !!CFG[k]; i.addEventListener('change', () => { CFG[k] = i.checked; saveCfg(); if (k === 'sound') ENG.AUD.enable(CFG.sound); if (k === 'tts') ENG.AUD.enableTTS(CFG.tts); }); return el('label', { class: 'inl' }, i, label); } else { i = el('input', { type, value: CFG[k] || '', autocomplete: 'off', spellcheck: false }); i.addEventListener('change', () => { CFG[k] = i.value.trim(); saveCfg(); loadStatus(); }); } return el('label', { class: 'f' }, el('span', { text: label }), i); };
    sec.append(el('div', { class: 'scroll' },
      el('h3', { text: 'Backend' }), f('url', 'Adresse du backend (vide = celui qui sert cette page)', 'text'), f('token', 'Jeton (seulement si le backend exige BLM_TOKEN)', 'password'),
      el('h3', { text: 'Modèle' }), f('provider', 'Fournisseur', 'select', [['auto', 'Automatique (Ollama, puis Claude, puis Gemini, sinon BLM seul)'], ['ollama', 'Ollama (Llama, sur ton appareil)'], ['anthropic', 'Claude (clé dans le backend)'], ['gemini', 'Gemini (clé dans le backend)'], ['local', 'BLM seul, sans LLM']]), f('model', 'Nom du modèle (vide = celui du backend)', 'text'),
      el('div', { class: 'card hint', id: 'provinfo', text: '…' }),
      el('h3', { text: 'Réponses' }), f('ideas', 'Ajouter 3 idées différentes (propositions)', 'check'), f('longueur', 'Règle de longueur DEN : pas trop, pas trop peu', 'check'), f('economie', 'Économie de batterie : bas de la plage de longueur', 'check'),
      el('h3', { text: 'Affichage et son' }), f('balloons', 'Ballons de peinture (affichage AFF)', 'check'), f('sound', 'Sons : carillon par bot, éclatements, placement binaural', 'check'), f('tts', 'Lire les réponses à voix haute (voix du navigateur, hauteur propre à chaque bot)', 'check'),
      el('h3', { text: 'Données' }), el('button', { text: 'Effacer toutes les conversations de cet appareil', onclick: () => { if (confirm('Tout effacer ?')) { Object.keys(chats).forEach(id => store.del('blm.chat.' + id)); location.reload(); } } })));
    return sec;
  }

  /* ---------------- état du backend ---------------- */
  function markOffline() { $('#banner').classList.add('on'); $('#dot').className = 'bad'; STATUS = null; refreshProv(); }
  function refreshProv() {
    const p = $('#prov'); let t, info;
    if (!STATUS) { t = 'backend non joint'; info = 'Le backend ne répond pas. Lance « node backend.js » puis recharge la page.'; }
    else {
      const a = STATUS.providers, want = CFG.provider, real = want !== 'auto' ? (a[want] ? want : 'local') : (a.ollama ? 'ollama' : a.anthropic ? 'anthropic' : a.gemini ? 'gemini' : 'local');
      t = real === 'local' ? 'BLM seul (sans LLM)' : 'LLM : ' + real + ' · ' + (CFG.model || STATUS.models[real]);
      info = 'Disponibles : Ollama ' + (a.ollama ? '✔' : '✖') + ' · Claude ' + (a.anthropic ? '✔' : '✖') + ' · Gemini ' + (a.gemini ? '✔' : '✖') + '. Base : ' + STATUS.baseChars.toLocaleString('fr-FR') + ' caractères, ' + STATUS.extraits + ' extraits, ' + STATUS.lexique + ' mots du lexique. Version ' + STATUS.version + '.' + (want !== 'auto' && !a[want] && want !== 'local' ? ' Le fournisseur choisi n’est pas disponible : repli sur « BLM seul ».' : '');
      $('#dot').className = real === 'local' ? 'ok' : 'llm';
    }
    p.textContent = t; if (p.dataset.last) p.title = p.dataset.last; const pi = $('#provinfo'); if (pi) pi.textContent = info;
    const bs = $('#basestat'); if (bs && STATUS) bs.textContent = STATUS.extraits + ' extraits · ' + STATUS.lexique + ' mots · adresse (HS0, KIF5…) ou mot';
  }
  async function loadStatus() {
    try { const r = await fetch(base() + '/api/status', { headers: headers() }); if (!r.ok) throw new Error(r.status === 401 ? 'jeton refusé' : 'HTTP ' + r.status); STATUS = await r.json(); $('#banner').classList.remove('on'); }
    catch (e) { STATUS = null; $('#banner').textContent = 'Backend non joint (' + e.message + '). Lance « node backend.js » dans le dossier, puis recharge. Adresse utilisée : ' + (base() || location.origin) + '.'; $('#banner').classList.add('on'); }
    refreshProv();
  }

  /* ---------------- routeur SPA ---------------- */
  const pages = {};
  function boot() {
    document.title = 'BLM · SuperBots ' + 'V1.0A.18';
    const tabs = $('#tabs'), host = $('#pages');
    PAGES.forEach(pg => {
      const sec = pg.chat ? buildChat(pg) : pg.id === 'atelier' ? buildAtelier(pg) : pg.id === 'base' ? buildBase(pg) : buildSettings(pg);
      host.append(sec); pages[pg.id] = sec;
      tabs.append(el('a', { href: '#/' + pg.id, 'data-id': pg.id, style: '--tc:hsl(' + pg.hue + ' 80% 60%)' }, el('span', { text: pg.ico }), pg.n));
    });
    addEventListener('hashchange', route); route(); loadStatus(); setInterval(loadStatus, 30000);
    ENG.AUD.enable(CFG.sound); ENG.AUD.enableTTS(CFG.tts);
    if ('serviceWorker' in navigator) { /* pas de service worker : un seul fichier, pas de fichier annexe */ }
  }
  function route() {
    const [, id0, arg] = (location.hash || '#/famille').split('/'); const id = pages[id0] ? id0 : 'famille';
    Object.entries(pages).forEach(([k, s]) => s.classList.toggle('on', k === id));
    document.querySelectorAll('#tabs a').forEach(a => { if (a.dataset.id === id) { a.setAttribute('aria-current', 'page'); a.scrollIntoView({ inline: 'center', block: 'nearest' }); } else a.removeAttribute('aria-current'); });
    const th = pages[id].dataset.theme; document.body.dataset.theme = th;
    const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = getComputedStyle(pages[id]).getPropertyValue('--bg').trim() || '#0b0d16';
    if (pages[id]._init) pages[id]._init(); if (pages[id]._open) pages[id]._open(arg);
    if (chats[id]) chats[id].log.scrollTop = chats[id].log.scrollHeight;
  }
  boot();
})();
