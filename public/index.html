<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Famille SuperBots</title>
<style>
:root{--bg:#EEF1F4;--panel:#FFF;--line:#D5DCE3;--fg:#17212C;--muted:#5A6878;--accent:#0B6E78;--soft:#D6EDEF;--token:#A5660F;--tsoft:#F6E9D4;--warn:#B3261E;--ok:#2E7D32;
--display:"Trebuchet MS","Segoe UI",system-ui,sans-serif;--body:system-ui,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F151C;--panel:#161E27;--line:#29343F;--fg:#E3E9EF;--muted:#94A3B3;--accent:#4CC2CC;--soft:#12343A;--token:#E0A54A;--tsoft:#3A2B14;--warn:#F2837A;--ok:#7CC784;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
h1{font:700 1.8rem var(--display);margin:0}h1 span{color:var(--accent)}
h2{font:600 1rem var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0}
.sub,.hint{color:var(--muted);margin:0;font-size:.88rem}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
nav button,.seg button{flex:0 0 auto;font:inherit;font-size:.88rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
nav button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
label{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=range],input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row>*{min-width:0}
.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer;width:auto}
.btn:disabled{opacity:.45;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--tsoft);color:var(--token)}
.pill.cls{background:var(--soft);color:var(--accent)}.pill.ok{border:1px solid var(--ok);color:var(--ok);background:none}.pill.warn{border:1px solid var(--warn);color:var(--warn);background:none}
.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.bot{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.bot[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}.tok{margin-left:auto;font:.8rem var(--mono);color:var(--token)}
.answer{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px}.stripe{border-radius:2px}
.answer p{margin:4px 0 0;white-space:pre-wrap}
pre{font:.8rem/1.45 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:420px;margin:0;white-space:pre-wrap}
canvas{max-width:100%;border:1px solid var(--line);border-radius:8px;image-rendering:pixelated}
.err{color:var(--warn)}
</style>
</head>
<body>
<!-- L'interface est écrite en COFF : Syntaxor la compile en HTML au chargement. -->
<script type="text/coff" id="interface">
<co tag="div" class="wrap">
  <co tag="header" class="row" style="justify-content:space-between">
    <co tag="div">
      <co tag="h1" symbol="🧅">Famille <co tag="span">SuperBots</co></co>
      <co tag="p" class="sub">Llama écrit, le BLM de la famille l'équipe : fiches, règles, arbitrage, visa.</co>
    </co>
    <co tag="div" class="row">
      <co tag="span" class="pill" id="etat-llm">…</co>
      <co tag="span" class="pill" id="etat-jetons">…</co>
    </co>
  </co>
  <co tag="div" class="row">
    <co tag="label" for="serveur">Serveur</co>
    <co tag="input" id="serveur" placeholder="http://localhost:8787" style="max-width:280px" />
    <co tag="button" class="btn" id="connecter" type="button">Connecter</co>
    <co tag="span" class="hint" id="stats"></co>
  </co>
  <co tag="nav" id="onglets">
    <co tag="button" data-onglet="famille" aria-selected="true">Famille</co>
    <co tag="button" data-onglet="golem">Golem Motor</co>
    <co tag="button" data-onglet="btb">B.T.B</co>
    <co tag="button" data-onglet="matrixia">Matrixia</co>
    <co tag="button" data-onglet="cybersam">CyberSam</co>
    <co tag="button" data-onglet="balancier">Balancier et lucidité</co>
    <co tag="button" data-onglet="justicia">Justicia</co>
    <co tag="button" data-onglet="producteur">Producteur</co>
    <co tag="button" data-onglet="bibliotheque">Bibliothèque</co>
  </co>

  <co tag="section" id="p-famille" state="actif">
    <co tag="h2">Demander à la famille</co>
    <co tag="div" class="seg row" id="modes">
      <co tag="button" data-mode="aleatoire" aria-pressed="true">Aléatoire</co>
      <co tag="button" data-mode="choisi" aria-pressed="false">Choisi (1 à 4)</co>
      <co tag="button" data-mode="synerbote" aria-pressed="false">Synerboté</co>
      <co tag="button" data-mode="orl" aria-pressed="false">L'ORL (Théo + Justicia)</co>
    </co>
    <co tag="div" class="bots" id="liste-bots"></co>
    <co tag="div" class="row">
      <co tag="label" for="nb">Bots</co><co tag="select" id="nb" style="width:auto"><co tag="option">1</co><co tag="option" selected>2</co><co tag="option">3</co><co tag="option">4</co></co>
      <co tag="label" for="premium">Premium</co><co tag="input" type="checkbox" id="premium" />
      <co tag="label" for="batterie">Batterie</co><co tag="input" type="range" id="batterie" min="1" max="100" value="80" />
      <co tag="label" for="chaleur">Chaleur</co><co tag="input" type="range" id="chaleur" min="20" max="60" value="32" />
      <co tag="span" class="hint" id="device">80 % · 32 °C</co>
    </co>
    <co tag="div" class="row">
      <co tag="label" for="theo-mode">Théo</co>
      <co tag="select" id="theo-mode" style="width:auto"><co tag="option" value="">mode libre</co><co tag="option">conteur</co><co tag="option">prof_logique</co><co tag="option">theoricien</co><co tag="option">debatteur</co><co tag="option">lois_regles</co></co>
      <co tag="input" id="theo-religion" placeholder="Religion (ex. judaïsme)" style="max-width:220px" />
    </co>
    <co tag="label" for="question">Question</co>
    <co tag="textarea" id="question">Mon téléphone chauffe quand je lance le moteur de rendu de mon jeu : je fais quoi ?</co>
    <co tag="div" class="row"><co tag="button" class="btn" id="demander" type="button">Envoyer à la famille</co><co tag="span" class="hint" id="info"></co></co>
    <co tag="div" id="fil" style="display:grid;gap:14px"></co>
  </co>

  <co tag="section" id="p-golem" hidden>
    <co tag="h2">Golem Motor · cycle 4.5D</co>
    <co tag="p" class="hint">① ombre/lumière → ② netteté → ③ couleur → ④ reflet (burst). L'image est réduite à 256 pixels de côté.</co>
    <co tag="div" class="row"><co tag="input" type="file" id="golem-fichier" accept="image/*" style="width:auto" /><co tag="label" for="golem-force">Force</co><co tag="input" type="range" id="golem-force" min="0" max="100" value="60" /><co tag="button" class="btn" id="golem-go" type="button">Lancer le cycle</co></co>
    <co tag="div" class="row"><co tag="canvas" id="golem-avant" width="256" height="160"></co><co tag="canvas" id="golem-apres" width="256" height="160"></co></co>
    <co tag="pre" id="golem-sortie">Choisis une image, ou lance le cycle sur l'image d'exemple.</co>
  </co>

  <co tag="section" id="p-btb" hidden>
    <co tag="h2">B.T.B · typage des unités</co>
    <co tag="label" for="btb-eq">Équation</co><co tag="input" id="btb-eq" value="E = m * c^2" />
    <co tag="label" for="btb-un">Unités des symboles (JSON)</co><co tag="input" id="btb-un" value='{"E":"J","m":"kg","c":"m/s"}' />
    <co tag="button" class="btn" type="button" data-api="/api/btb/typage" data-champs="equation=btb-eq,unites=btb-un:json" data-sortie="btb-sortie">Vérifier</co>
    <co tag="pre" id="btb-sortie"></co>
  </co>

  <co tag="section" id="p-matrixia" hidden>
    <co tag="h2">Matrixia · matrices et maternes</co>
    <co tag="label" for="mx-code">Code open source à découper</co>
    <co tag="textarea" id="mx-code" style="min-height:160px">function bonjour(nom) {
  return "Bonjour " + nom;
}
const somme = (a, b) => {
  return a + b;
};</co>
    <co tag="div" class="row"><co tag="label" for="mx-lignes">Lignes par écran</co><co tag="input" id="mx-lignes" type="number" value="40" style="max-width:100px" />
    <co tag="button" class="btn" type="button" data-api="/api/matrixia/decouper" data-champs="code=mx-code,lignesParEcran=mx-lignes:nombre" data-sortie="mx-sortie">Découper</co></co>
    <co tag="pre" id="mx-sortie"></co>
  </co>

  <co tag="section" id="p-cybersam" hidden>
    <co tag="h2">CyberSam · recyclage et états</co>
    <co tag="label" for="cs-orig">Original</co><co tag="textarea" id="cs-orig">Donnée d'origine du bloc BLM, intacte.</co>
    <co tag="label" for="cs-copie">Copie</co><co tag="textarea" id="cs-copie">Donnée d'origine du bloc BLM, intacte!</co>
    <co tag="button" class="btn" type="button" data-api="/api/cybersam/recycler" data-champs="original=cs-orig,copie=cs-copie" data-sortie="cs-sortie">Recycler</co>
    <co tag="div" class="row"><co tag="label" for="cs-etat">État</co>
      <co tag="select" id="cs-etat" style="width:auto"><co tag="option">actif</co><co tag="option">passif</co><co tag="option">dormant</co><co tag="option">zombie</co><co tag="option">recyclage</co><co tag="option">ressuscite</co><co tag="option">fantome</co></co>
      <co tag="select" id="cs-perception" style="width:auto"><co tag="option" value="1">perçu (+1)</co><co tag="option" value="-1">non perçu (-1)</co></co>
      <co tag="button" class="btn" type="button" data-api="/api/cybersam/etat" data-champs="etat=cs-etat,perception=cs-perception:nombre" data-sortie="cs-sortie">Rencontre de perception</co></co>
    <co tag="pre" id="cs-sortie"></co>
  </co>

  <co tag="section" id="p-balancier" hidden>
    <co tag="h2">Balancier et lucidité</co>
    <co tag="label" for="bl-q">Question</co><co tag="input" id="bl-q" value="Salut, mon appli plante, j'ai peur" />
    <co tag="label" for="bl-r">Réponse à évaluer</co><co tag="textarea" id="bl-r">Salut ! Ton appli plante mais c'est réparable : on sauvegarde, puis on corrige le bug étape par étape. Solution simple et sûre.</co>
    <co tag="div" class="row">
      <co tag="button" class="btn" type="button" data-api="/api/balancier" data-champs="texte=bl-r" data-sortie="bl-sortie">Balancier</co>
      <co tag="button" class="btn" type="button" data-api="/api/lucidite" data-champs="question=bl-q,reponse=bl-r" data-sortie="bl-sortie">Lucidité</co>
    </co>
    <co tag="pre" id="bl-sortie"></co>
  </co>

  <co tag="section" id="p-justicia" hidden>
    <co tag="h2">Justicia · visa et droits</co>
    <co tag="label" for="ju-t">Texte à viser</co><co tag="textarea" id="ju-t">Je veux revendre les musiques de mon comic avec le logo de ma marque.</co>
    <co tag="button" class="btn" type="button" data-api="/api/justicia/visa" data-champs="texte=ju-t" data-sortie="ju-sortie">Demander le visa</co>
    <co tag="pre" id="ju-sortie"></co>
  </co>

  <co tag="section" id="p-producteur" hidden>
    <co tag="h2">Superbot Producteur · naissance</co>
    <co tag="div" class="row"><co tag="select" id="pr-a" style="width:auto"></co><co tag="select" id="pr-b" style="width:auto"></co>
    <co tag="button" class="btn" type="button" data-api="/api/producteur/naissance" data-champs="parentA=pr-a,parentB=pr-b" data-sortie="pr-sortie">Faire naître</co>
    <co tag="button" class="btn" type="button" data-api="/api/transfusion" data-champs="bots=pr-a+pr-b" data-sortie="pr-sortie">Transfusionner</co></co>
    <co tag="pre" id="pr-sortie"></co>
  </co>

  <co tag="section" id="p-bibliotheque" hidden>
    <co tag="h2">Bibliothèque BLM</co>
    <co tag="div" class="row"><co tag="input" id="bi-q" value="reflet lumière" style="max-width:320px" /><co tag="select" id="bi-bot" style="width:auto"><co tag="option" value="">tous les bots</co></co><co tag="button" class="btn" id="bi-go" type="button">Chercher</co></co>
    <co tag="pre" id="bi-sortie"></co>
  </co>
</co>
</script>

<script>
/* ── Syntaxor : compile le COFF (<co tag="…">) en éléments HTML ── */
function syntaxor(source) {
  const VIDES = new Set(["input", "img", "br", "hr", "meta", "link"]), racine = document.createDocumentFragment(), pile = [racine];
  const re = /<co\b((?:"[^"]*"|'[^']*'|[^>"'])*)>|<\/co>/g; let dernier = 0, m;
  const texte = (t) => { if (t.trim()) pile[pile.length - 1].appendChild(document.createTextNode(t.replace(/^\n+|\s+$/g, ""))); };
  while ((m = re.exec(source))) {
    texte(source.slice(dernier, m.index)); dernier = re.lastIndex;
    if (m[0] === "</co>") { if (pile.length > 1) pile.pop(); continue; }
    let brut = m[1]; const auto = /\/\s*$/.test(brut); if (auto) brut = brut.replace(/\/\s*$/, "");
    const at = {}; brut.replace(/([\w-]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'))?/g, (_, k, a, b) => { at[k] = a ?? b ?? ""; });
    const el = document.createElement(at.tag || "div"); delete at.tag;
    for (const [k, v] of Object.entries(at)) el.setAttribute(k === "symbol" || k === "state" ? "data-" + k : k, v);
    pile[pile.length - 1].appendChild(el);
    if (!auto && !VIDES.has(el.tagName.toLowerCase())) pile.push(el);
  }
  texte(source.slice(dernier));
  return racine;
}
document.body.appendChild(syntaxor(document.getElementById("interface").textContent));

/* ── Liaison avec le backend ── */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let BASE = "", BOTS = [], mode = "aleatoire", choisis = new Set();
try { BASE = localStorage.getItem("sb-serveur") || ""; } catch {}
if (!BASE && location.protocol.startsWith("http")) BASE = location.origin;
$("serveur").value = BASE || "http://localhost:8787";

async function api(ch, corps) {
  const r = await fetch(BASE + ch, corps ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps) } : {});
  const d = await r.json(); if (!r.ok) throw new Error(d.erreur || "Erreur " + r.status); return d;
}
function lisible(v, n = 0) { // affiche une réponse JSON en texte lisible
  const pad = "  ".repeat(n);
  if (Array.isArray(v)) return v.length ? v.map((x) => typeof x === "object" && x ? `${pad}-\n${lisible(x, n + 1)}` : `${pad}- ${x}`).join("\n") : `${pad}(vide)`;
  if (v && typeof v === "object") return Object.entries(v).map(([k, x]) => typeof x === "object" && x ? `${pad}${k} :\n${lisible(x, n + 1)}` : `${pad}${k} : ${x}`).join("\n");
  return pad + v;
}

document.querySelectorAll("#onglets button").forEach((b) => (b.onclick = () => {
  document.querySelectorAll("#onglets button").forEach((x) => x.setAttribute("aria-selected", x === b ? "true" : "false"));
  document.querySelectorAll("section[id^='p-']").forEach((s) => (s.hidden = s.id !== "p-" + b.dataset.onglet));
}));

// Boutons génériques : data-api, data-champs="cle=id[:json|:nombre]" (ou bots=id+id), data-sortie
document.querySelectorAll("[data-api]").forEach((b) => (b.onclick = async () => {
  const corps = {};
  for (const c of b.dataset.champs.split(",")) {
    const [cle, ref] = c.split("=");
    if (ref.includes("+")) { corps[cle] = ref.split("+").map((id) => $(id).value); continue; }
    const [id, type] = ref.split(":"), v = $(id).value;
    try { corps[cle] = type === "json" ? JSON.parse(v || "{}") : type === "nombre" ? Number(v) : v; }
    catch { $(b.dataset.sortie).textContent = `Le champ ${id} n'est pas du JSON valide.`; return; }
  }
  if (corps.parentA !== undefined) corps.device = device();
  b.disabled = true;
  try { $(b.dataset.sortie).textContent = lisible(await api(b.dataset.api, corps)); }
  catch (e) { $(b.dataset.sortie).textContent = "Erreur : " + e.message; }
  b.disabled = false;
}));

const device = () => ({ batterie: +$("batterie").value, chaleur: +$("chaleur").value });
["batterie", "chaleur"].forEach((id) => ($(id).oninput = () => ($("device").textContent = `${$("batterie").value} % · ${$("chaleur").value} °C`)));

function afficherBots(jetons) {
  if (jetons) BOTS.forEach((b) => (b.jetons = jetons[b.id]));
  $("liste-bots").innerHTML = "";
  BOTS.filter((b) => b.famille !== "Synthèse").forEach((b) => {
    const el = document.createElement("button"); el.type = "button"; el.className = "bot"; el.title = b.role;
    el.setAttribute("aria-pressed", mode === "choisi" && choisis.has(b.id) ? "true" : "false");
    el.innerHTML = `<span class="dot" style="background:${esc(b.couleur)}"></span><span>${esc(b.nom)}</span><span class="tok">${b.jetons}</span>`;
    el.onclick = () => { if (mode !== "choisi") setMode("choisi"); choisis.has(b.id) ? choisis.delete(b.id) : choisis.size < 4 && choisis.add(b.id); afficherBots(); };
    $("liste-bots").appendChild(el);
  });
  $("etat-jetons").textContent = BOTS.reduce((s, b) => s + (b.jetons || 0), 0) + " jetons";
}
function setMode(m) { mode = m; document.querySelectorAll("#modes button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m ? "true" : "false")); afficherBots(); }
document.querySelectorAll("#modes button").forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));

function bloc(nom, couleur, pill, texte, fiches) {
  const d = document.createElement("div"); d.className = "answer";
  d.innerHTML = `<span class="stripe" style="background:${esc(couleur)}"></span><div style="min-width:0"><b>${esc(nom)}</b> ${pill}<p>${esc(texte)}</p>${fiches && fiches.length ? `<details><summary class="hint">${fiches.length} fiches BLM</summary><pre>${esc(fiches.join("\n"))}</pre></details>` : ""}</div>`;
  return d;
}
$("demander").onclick = async () => {
  $("demander").disabled = true; $("info").textContent = "La famille réfléchit…";
  try {
    const r = await api("/api/demander", { question: $("question").value, mode, bots: [...choisis], nb: +$("nb").value, premium: $("premium").checked, device: device(), theo: { mode: $("theo-mode").value, religion: $("theo-religion").value } });
    const t = document.createElement("div"); t.style.cssText = "display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px";
    t.innerHTML = `<b>${esc(r.question)}</b><div class="row"><span class="pill cls">Priorité : ${esc(r.priorite.nom)}</span><span class="pill cls">STH : ${esc(r.sth.action)}</span><span class="pill">${r.caisse} jetons redistribués</span><span class="pill cls">Balancier ${r.balance.score}</span><span class="pill ${r.lucidite.note > 5 ? "ok" : "warn"}">Lucidité ${r.lucidite.note}/10 · ${esc(r.lucidite.evolution)}</span></div>`;
    if (r.journal.length) { const p = document.createElement("pre"); p.textContent = r.journal.map((l) => `${l.qui} · ${l.texte}`).join("\n"); t.appendChild(p); }
    r.reponses.forEach((x) => t.appendChild(bloc(x.nom, x.couleur, `<span class="pill">mise ${x.mise} · ${x.moteur}</span>`, x.texte, x.fiches)));
    if (r.synthese) t.appendChild(bloc(r.synthese.nom, "var(--accent)", `<span class="pill cls">synthèse</span>`, r.synthese.texte));
    t.appendChild(bloc("Visa de Justicia", "#1E3A8A", `<span class="pill ${r.visa.statut === "refusé" ? "warn" : "ok"}">${esc(r.visa.statut)}</span>`, r.visa.texte));
    $("fil").prepend(t); afficherBots(r.jetons); $("info").textContent = "";
  } catch (e) { $("info").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  $("demander").disabled = false;
};

/* Golem Motor : image → RGBA base64 → cycle → canvas */
function dessinerExemple() {
  const c = $("golem-avant"), x = c.getContext("2d"), g = x.createLinearGradient(0, 0, c.width, c.height);
  g.addColorStop(0, "#1b2a3a"); g.addColorStop(1, "#6a7f5a"); x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = "#f4e7c5"; x.beginPath(); x.arc(180, 50, 22, 0, 7); x.fill(); x.fillStyle = "#2c3b2a"; x.fillRect(20, 110, 216, 40);
}
dessinerExemple();
$("golem-fichier").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return; const img = new Image();
  img.onload = () => { const k = Math.min(1, 256 / Math.max(img.width, img.height)), c = $("golem-avant"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
};
$("golem-go").onclick = async () => {
  const c = $("golem-avant"), d = c.getContext("2d").getImageData(0, 0, c.width, c.height);
  let bin = ""; const u = new Uint8Array(d.data.buffer); for (let i = 0; i < u.length; i += 8192) bin += String.fromCharCode(...u.subarray(i, i + 8192));
  $("golem-go").disabled = true;
  try {
    const r = await api("/api/golem/cycle", { largeur: c.width, hauteur: c.height, pixels: btoa(bin), force: +$("golem-force").value / 100 });
    const o = $("golem-apres"); o.width = r.largeur; o.height = r.hauteur;
    const raw = atob(r.pixels), arr = new Uint8ClampedArray(raw.length); for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    o.getContext("2d").putImageData(new ImageData(arr, r.largeur, r.hauteur), 0, 0);
    $("golem-sortie").textContent = lisible({ journal: r.journal, vixel: r.vixel });
  } catch (e) { $("golem-sortie").textContent = "Erreur : " + e.message; }
  $("golem-go").disabled = false;
};

$("bi-go").onclick = async () => {
  try { const r = await api(`/api/recherche?q=${encodeURIComponent($("bi-q").value)}&bot=${$("bi-bot").value}&k=15`); $("bi-sortie").textContent = r.map((x) => `[${x.bot} · ${x.type}] ${x.texte}`).join("\n") || "Aucune fiche."; }
  catch (e) { $("bi-sortie").textContent = "Erreur : " + e.message; }
};

async function connecter() {
  BASE = $("serveur").value.replace(/\/$/, ""); try { localStorage.setItem("sb-serveur", BASE); } catch {}
  try {
    const [bots, sante, stats] = await Promise.all([api("/api/bots"), api("/api/sante"), api("/api/stats")]);
    BOTS = bots;
    $("etat-llm").textContent = sante.moteur === "llama" ? `LLM : ${sante.llama.modele}` : "LLM : mode démo"; $("etat-llm").className = "pill " + (sante.moteur === "llama" ? "ok" : "warn"); $("etat-llm").title = sante.llama.raison || "";
    $("stats").textContent = `${stats.bots} bots · ${stats.fiches.toLocaleString("fr-FR")} fiches · ${stats.regles.toLocaleString("fr-FR")} règles`;
    const opts = bots.filter((b) => b.famille !== "Synthèse").map((b) => `<option value="${esc(b.id)}">${esc(b.nom)}</option>`).join("");
    $("pr-a").innerHTML = opts; $("pr-b").innerHTML = opts; $("pr-b").selectedIndex = 1;
    $("bi-bot").innerHTML = `<option value="">tous les bots</option>` + bots.map((b) => `<option value="${esc(b.id)}">${esc(b.nom)}</option>`).join("");
    setMode("aleatoire");
  } catch (e) { $("etat-llm").textContent = "Serveur injoignable"; $("etat-llm").className = "pill warn"; $("stats").textContent = "Lance « node server.js » puis clique sur Connecter."; }
}
$("connecter").onclick = connecter;
connecter();
</script>
</body>
</html>
